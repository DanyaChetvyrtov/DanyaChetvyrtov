name: Generate profile stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-cards.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate and commit profile SVGs
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: DanyaChetvyrtov
          cards: overview,languages,momentum,composition
          output-dir: assets/profile-stats
          themes: light,dark
          commit: true
